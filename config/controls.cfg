# ClayTality 64 controls by djultra64.
# Manual fallback: auto, xbox, playstation, switch.
# bind ACTION_INDEX PHYSICAL_POSITION SDL_SCANCODE_NAME
# Physical positions remain unchanged when display family changes.
family auto
bind 0 south Z
bind 1 west X
bind 2 start Return
bind 3 left_trigger Left Shift
bind 4 left_shoulder Q
bind 5 right_shoulder E
bind 6 north I
bind 7 right_trigger K
bind 8 back J
bind 9 east L
bind 10 dpad_up Up
bind 11 dpad_down Down
bind 12 dpad_left Left
bind 13 dpad_right Right
